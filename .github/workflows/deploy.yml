name: Deploy PRJ Board

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prj-board-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://prj.curromatteo.it/
    env:
      GANDI_SFTP_HOST: ${{ secrets.GANDI_SFTP_HOST }}
      GANDI_SFTP_USER: ${{ secrets.GANDI_SFTP_USER }}
      GANDI_SFTP_PRIVATE_KEY: ${{ secrets.GANDI_SFTP_PRIVATE_KEY }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DB_NAME: prj_cur
      REMOTE_ROOT: /lamp0/web/vhosts/prj.curromatteo.it
      REMOTE_PATH: /lamp0/web/vhosts/prj.curromatteo.it/htdocs
      EXPECTED_ED25519_MD5: MD5:5a:f5:68:71:4b:86:b4:96:61:1c:5f:d9:b1:21:4f:31

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment secrets
        id: config
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in GANDI_SFTP_HOST GANDI_SFTP_USER GANDI_SFTP_PRIVATE_KEY DB_HOST DB_USER DB_PASSWORD APP_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::notice::Missing secret $name"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped until all required secrets are configured."
          fi

      - name: Validate source
        run: |
          set -euo pipefail
          php -l api/index.php
          php -l lib/mailer.php
          php -l lib/digest.php
          php -l lib/calendar.php
          php -l api/calendar.php
          php -l jobs/digest.php
          node --check js/app.js
          node tests/ui-contract.mjs
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('js/app.js', 'utf8');
          const bad = [...source.matchAll(/(?<!\$)\$\([^)]*\)\.(?:forEach|map|filter)\b/g)].map(m => m[0]);
          if (bad.length) {
            console.error('Single-element selector used with collection method:', bad);
            process.exit(1);
          }
          NODE
          test -f index.html
          test -f assets/app.css
          grep -Fq 'Bricolage+Grotesque' index.html
          grep -Fq 'Sortable.min.js' index.html

      - name: Build deployment payload
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/assets dist/js dist/api dist/lib dist/jobs
          cp index.html .htaccess dist/
          cp assets/app.css dist/assets/
          cp js/app.js dist/js/
          cp api/index.php api/calendar.php dist/api/
          cp lib/mailer.php lib/digest.php lib/calendar.php dist/lib/
          cp jobs/digest.php dist/jobs/

          # Cache-bust frontend assets on every deployment so clients never keep
          # an older app.js/app.css after an interaction fix.
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('dist/index.html')
          html = path.read_text(encoding='utf-8')
          sha = os.environ['GITHUB_SHA']
          html = re.sub(r'assets/app\.css\?v=[^"]+', f'assets/app.css?v={sha}', html)
          html = re.sub(r'js/app\.js\?v=[^"]+', f'js/app.js?v={sha}', html)
          path.write_text(html, encoding='utf-8')
          PY

          grep -Fq "assets/app.css?v=$GITHUB_SHA" dist/index.html
          grep -Fq "js/app.js?v=$GITHUB_SHA" dist/index.html
          find dist -type f -print

      - name: Build private runtime config
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          def php_string(value: str) -> str:
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          smtp_user = os.environ.get("SMTP_USER", "").strip()
          smtp_password = os.environ.get("SMTP_PASSWORD", "")
          resend_api_key = os.environ.get("RESEND_API_KEY", "").strip()
          if bool(smtp_user) != bool(smtp_password):
              raise SystemExit("SMTP_USER and SMTP_PASSWORD must be configured together.")

          if resend_api_key:
              mail_provider = "resend"
              use_authenticated_smtp = True
              sender = "prj@curromatteo.it"
              smtp_host = "ssl://smtp.resend.com"
              smtp_port = 465
              smtp_login = "resend"
              smtp_secret = resend_api_key
          elif smtp_user and smtp_password:
              mail_provider = "gandi-mail"
              use_authenticated_smtp = True
              sender = smtp_user
              smtp_host = "ssl://mail.gandi.net"
              smtp_port = 465
              smtp_login = smtp_user
              smtp_secret = smtp_password
          else:
              mail_provider = "gandi-webhosting"
              use_authenticated_smtp = False
              sender = "prj@curromatteo.it"
              smtp_host = "localhost"
              smtp_port = 25
              smtp_login = ""
              smtp_secret = ""

          config = """<?php
          return [
              'db_host' => %s,
              'db_port' => 3306,
              'db_name' => %s,
              'db_user' => %s,
              'db_pass' => %s,
              'app_password' => %s,
              'app_url' => 'https://prj.curromatteo.it',
              'mail_from' => %s,
              'mail_from_name' => 'PRJ',
              'mail_provider' => %s,
              'mail_transport' => %s,
              'smtp_host' => %s,
              'smtp_port' => %d,
              'smtp_helo' => 'prj.curromatteo.it',
              'smtp_timeout' => 8,
              'smtp_user' => %s,
              'smtp_pass' => %s,
              'mail_fallback_php' => false,
          ];
          """ % (
              php_string(os.environ["DB_HOST"]),
              php_string(os.environ["DB_NAME"]),
              php_string(os.environ["DB_USER"]),
              php_string(os.environ["DB_PASSWORD"]),
              php_string(os.environ["APP_PASSWORD"]),
              php_string(sender),
              php_string(mail_provider),
              php_string("smtp" if use_authenticated_smtp else "php-mail"),
              php_string(smtp_host),
              smtp_port,
              php_string(smtp_login),
              php_string(smtp_secret),
          )

          Path("/tmp/prj-config.php").write_text(config, encoding="utf-8")
          PY
          php -l /tmp/prj-config.php

      - name: Configure deploy key and verify Gandi host
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$GANDI_SFTP_PRIVATE_KEY" > "$HOME/.ssh/gandi_deploy"
          chmod 600 "$HOME/.ssh/gandi_deploy"

          ssh-keygen -y -P '' -f "$HOME/.ssh/gandi_deploy" > /tmp/gandi_deploy.pub
          ssh-keyscan -p 22 -t ed25519 "$GANDI_SFTP_HOST" > /tmp/gandi_known_host 2>/dev/null
          test -s /tmp/gandi_known_host

          ACTUAL_FP="$(ssh-keygen -lf /tmp/gandi_known_host -E md5 | awk '{print $2}')"
          echo "Gandi host fingerprint: $ACTUAL_FP"
          test "$ACTUAL_FP" = "$EXPECTED_ED25519_MD5" || {
            echo "Gandi host fingerprint mismatch; refusing deployment"
            exit 1
          }

          cat /tmp/gandi_known_host > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Build SFTP batch
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          {
            printf 'cd "%s"\n' "$REMOTE_PATH"
            printf '%s\n' '-mkdir "assets"' '-mkdir "js"' '-mkdir "api"' '-mkdir "lib"' '-mkdir "jobs"'

            find dist/assets dist/js dist/api dist/lib dist/jobs -type f -print0 | sort -z | while IFS= read -r -d '' file; do
              rel="${file#dist/}"
              printf 'put "%s" "%s"\n' "$file" "$rel"
            done

            printf 'put "%s" "%s"\n' "dist/.htaccess" ".htaccess"

            printf '%s\n' "-mkdir \"$REMOTE_ROOT/private\""
            printf 'put "%s" "%s"\n' "/tmp/prj-config.php" "$REMOTE_ROOT/private/config.php"
            printf 'chmod 600 "%s"\n' "$REMOTE_ROOT/private/config.php"

            # Index last: assets/API are already in place when the new UI becomes visible.
            printf '%s\n' 'put "dist/index.html" "index.html"' 'bye'
          } > /tmp/deploy.sftp

          echo "Files to upload: $(grep -c '^put ' /tmp/deploy.sftp)"

      - name: Deploy over native SFTP
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          sftp             -b /tmp/deploy.sftp             -i "$HOME/.ssh/gandi_deploy"             -o BatchMode=yes             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$HOME/.ssh/known_hosts"             -o ConnectTimeout=20             "$GANDI_SFTP_USER@$GANDI_SFTP_HOST"

      - name: Configure daily digest schedule
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail

          cat > /tmp/get-anacron.sftp <<'EOF'
          get "/lamp0/etc/cron/anacrontab" "/tmp/prj-anacrontab"
          bye
          EOF

          sftp \
            -b /tmp/get-anacron.sftp \
            -i "$HOME/.ssh/gandi_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            "$GANDI_SFTP_USER@$GANDI_SFTP_HOST"

          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/prj-anacrontab')
          lines = path.read_text(encoding='utf-8').splitlines()
          lines = [line for line in lines if ' prj_digest ' not in f' {line} ']
          lines.append('@daily 0 prj_digest php -f /srv/data/web/vhosts/prj.curromatteo.it/jobs/digest.php')
          path.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')
          PY

          grep -Fq 'prj_digest php -f /srv/data/web/vhosts/prj.curromatteo.it/jobs/digest.php' /tmp/prj-anacrontab

          cat > /tmp/put-anacron.sftp <<'EOF'
          put "/tmp/prj-anacrontab" "/lamp0/etc/cron/anacrontab"
          bye
          EOF

          sftp \
            -b /tmp/put-anacron.sftp \
            -i "$HOME/.ssh/gandi_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            "$GANDI_SFTP_USER@$GANDI_SFTP_HOST"

      - name: Verify production
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 -H 'Cache-Control: no-cache' \
            "https://prj.curromatteo.it/?deploy=${GITHUB_SHA}" -o /tmp/prj-live.html
          grep -Fq '<title>PRJ · Project Board</title>' /tmp/prj-live.html
          grep -Fq 'id="workspaceSelect"' /tmp/prj-live.html
          grep -Fq 'id="registerForm"' /tmp/prj-live.html
          grep -Fq "assets/app.css?v=${GITHUB_SHA}" /tmp/prj-live.html
          grep -Fq "js/app.js?v=${GITHUB_SHA}" /tmp/prj-live.html

          curl -fsSL --retry 4 --retry-delay 2 -H 'Cache-Control: no-cache' \
            "https://prj.curromatteo.it/api/index.php?action=health&deploy=${GITHUB_SHA}" -o /tmp/prj-health.json

          node - <<'NODE'
          const x = require('/tmp/prj-health.json');
          console.log('Health flags:', {ok:x.ok,schema:x.schema,has_workspace:x.has_workspace,has_column:x.has_column,uploads_writable:x.uploads_writable,mail_available:x.mail_available,smtp_available:x.smtp_available,smtp_ms:x.smtp_ms,smtp_error:x.smtp_error,email_transport_available:x.email_transport_available,email_transport:x.email_transport});
          if (!x.ok || x.schema !== '1.4' || !x.has_workspace || !x.has_column || !x.uploads_writable || !x.mail_available || !x.email_transport_available) process.exit(1);
          console.log('PRJ health OK: schema 1.4, private uploads writable, email transport='+x.email_transport+'.');
          NODE

          SPF="$(dig +short TXT curromatteo.it 2>/dev/null | tr -d '"' || true)"
          if [ -n "${RESEND_API_KEY:-}" ]; then
            echo "Mail provider: Resend SMTP. Domain authentication is validated by Resend on its configured return-path/DKIM records."
          elif [ -n "${SMTP_USER:-}" ]; then
            if printf '%s' "$SPF" | grep -Fq '_mailcust.gandi.net'; then
              echo "SPF check OK: Gandi Mail is authorized."
            else
              echo "::warning::SPF for curromatteo.it does not visibly include _mailcust.gandi.net. Authenticated Gandi Mail can accept messages that recipients later reject."
            fi
          else
            if printf '%s' "$SPF" | grep -Fq '_spf.gpaas.net'; then
              echo "SPF check OK: Gandi Web Hosting is authorized."
            else
              echo "::warning::SPF for curromatteo.it does not visibly include _spf.gpaas.net. PHP mail() can accept messages that recipients later reject."
            fi
          fi

          DMARC="$(dig +short TXT _dmarc.curromatteo.it 2>/dev/null | tr -d '"' || true)"
          if printf '%s' "$DMARC" | grep -Fq 'v=DMARC1'; then
            echo "DMARC check OK: $DMARC"
          else
            echo "::warning::No DMARC record detected for curromatteo.it. Consider starting with p=none and a monitored rua address."
          fi

          DKIM="$(dig +short CNAME gm1._domainkey.curromatteo.it 2>/dev/null || true)"
          if printf '%s' "$DKIM" | grep -Fq 'gm1.gandimail.net'; then
            echo "DKIM DNS check OK: gm1 selector present."
          else
            echo "::warning::Gandi Mail DKIM selector gm1 was not detected. This matters if messages are sent through Gandi Mail; Web Hosting relay signing should be verified from received headers."
          fi


          echo "PRJ Board deployed and health-checked: https://prj.curromatteo.it/"
